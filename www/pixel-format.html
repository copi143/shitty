<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素格式对比</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 20px;

      color: #333;
      background: #f5f5f5;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;

      font-size: 24px;
      font-weight: 600;
    }

    .subtitle {
      color: #666;

      font-size: 14px;
    }

    .control-bar {
      display: flex;
      align-items: center;

      margin-bottom: 25px;
      padding: 15px;

      background: white;

      gap: 15px;
    }

    .control-bar label {
      min-width: 80px;

      font-weight: 500;
    }

    #colorPicker {
      width: 50px;
      height: 40px;

      cursor: pointer;

      border: 1px solid #ddd;
      border-radius: 3px;
    }

    #hexInput {
      min-width: 120px;
      padding: 8px 12px;

      border: 1px solid #ddd;

      font-family: monospace;
      font-size: 14px;
    }

    .formats-grid {
      display: grid;

      margin-bottom: 30px;

      background-color: #333;

      grid-template-columns: 1fr;
      gap: 1px;
    }

    .format-card {
      display: grid;
      align-items: center;

      padding: 15px 20px;

      background: white;

      grid-template-columns: 140px 1fr auto;
      gap: 20px;
    }

    .format-title {
      letter-spacing: 0.5px;
      text-transform: uppercase;

      color: #333;

      font-size: 12px;
      font-weight: 600;
    }

    .bytes-row {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;

      gap: 2px;
    }

    .byte-box {
      display: flex;
      flex-direction: column;

      gap: 2px;
    }

    .byte-bits {
      display: flex;

      gap: 0px;
    }

    .bit {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 20px;
      height: 20px;

      color: #ccc;
      background: #f9f9f9;

      font-size: 10px;
      font-weight: 700;
    }

    .bit.on {
      color: #fff;
      background: #333;
    }

    .byte-label {
      text-align: center;

      color: #666;

      font-size: 10px;
      font-weight: 600;
    }

    .format-details {
      margin-top: 12px;
      padding-top: 12px;

      color: #666;
      border-top: 1px solid #eee;

      font-size: 13px;
      line-height: 1.6;
    }

    .detail-row {
      display: flex;

      margin: 4px 0;

      gap: 10px;
    }

    .detail-label {
      min-width: 80px;

      color: #333;

      font-weight: 500;
    }

    .detail-value {
      color: #666;

      font-family: monospace;
    }

    .summary-table {
      width: 100%;
      margin-top: 30px;

      border-collapse: collapse;
      background: white;

      font-size: 12px;
    }

    .summary-table th {
      padding: 10px 12px;

      text-align: left;

      color: #333;
      border-bottom: 1px solid #ddd;
      background: #f5f5f5;

      font-weight: 600;
    }

    .summary-table td {
      padding: 8px 12px;

      color: #666;
      border-bottom: 1px solid #eee;

      font-size: 11px;
    }

    .summary-table tr:hover {
      background: #fafafa;
    }

    .byte-size {
      color: #333;

      font-family: monospace;
      font-weight: 600;
    }

    .preview-strip {
      display: none;
    }

    /* CSS-based palette indicator */
    #palette {
      position: relative;

      overflow: hidden;

      width: 240px;
      height: 160px;

      cursor: crosshair;

      border: 1px solid #ddd;
      border-radius: 3px;
      background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0)), linear-gradient(to bottom, rgba(0, 0, 0, 0), #000), #fff;
    }

    .indicator {
      position: absolute;

      box-sizing: border-box;
      width: 14px;
      height: 14px;

      transform: translate(-50%, -50%);
      pointer-events: none;

      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6) inset;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>像素格式对比</h1>
      <p class="subtitle">选择颜色，对比所有格式的内存存储方式</p>
    </header>

    <div class="control-bar">
      <label>颜色：</label>
      <input type="color" id="colorPicker" value="#FF5733">
      <input type="text" id="hexInput" value="FF5733" readonly>
      <div style="display:flex;align-items:center;gap:12px;margin-left:12px;">
        <div id="palette">
          <div id="paletteIndicator" class="indicator"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;">
          <label style="font-size:12px;color:#333;">色相</label>
          <input id="hueSlider" type="range" min="0" max="360" value="14">
        </div>
      </div>
    </div>

    <div class="formats-grid" id="formatsContainer"></div>

    <div class="preview-strip" id="previewContainer"></div>

    <table class="summary-table">
      <thead>
        <tr>
          <th>格式</th>
          <th>通道配置</th>
          <th>颜色深度</th>
          <th>字节/像素</th>
          <th>用途</th>
        </tr>
      </thead>
      <tbody id="summaryTable"></tbody>
    </table>
  </div>

  <script>
    const formats = {
      rgb24: {
        name: 'RGB 24-bit',
        channels: [
          { name: 'R', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'B', bits: 8 }
        ],
        uses: 'BMP, JPG, PNG (无透明)',
        color_depth: '16.7M'
      },
      rgba32: {
        name: 'RGBA 32-bit',
        channels: [
          { name: 'R', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'B', bits: 8 },
          { name: 'A', bits: 8, special: true }
        ],
        uses: 'PNG, TIFF, Web 图像',
        color_depth: '16.7M + Alpha'
      },
      bgr24: {
        name: 'BGR 24-bit',
        channels: [
          { name: 'B', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'R', bits: 8 }
        ],
        uses: 'Windows BMP, 某些硬件',
        color_depth: '16.7M'
      },
      bgra32: {
        name: 'BGRA 32-bit',
        channels: [
          { name: 'B', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'R', bits: 8 },
          { name: 'A', bits: 8, special: true }
        ],
        uses: 'Direct3D, Windows',
        color_depth: '16.7M + Alpha'
      },
      rgb565: {
        name: 'RGB 16-bit (565)',
        channels: [
          { name: 'R', bits: 5 },
          { name: 'G', bits: 6 },
          { name: 'B', bits: 5 }
        ],
        uses: '嵌入式, 手机屏幕',
        color_depth: '65.5K'
      },
      bgr565: {
        name: 'BGR 16-bit (565)',
        channels: [
          { name: 'B', bits: 5 },
          { name: 'G', bits: 6 },
          { name: 'R', bits: 5 }
        ],
        uses: '某些 LCD 屏幕',
        color_depth: '65.5K'
      },
      rgb555: {
        name: 'RGB 15-bit (555)',
        channels: [
          { name: 'R', bits: 5 },
          { name: 'G', bits: 5 },
          { name: 'B', bits: 5 }
        ],
        uses: '旧系统, 游戏主机',
        color_depth: '32.7K'
      },
      argb8888: {
        name: 'ARGB 32-bit',
        channels: [
          { name: 'A', bits: 8, special: true },
          { name: 'R', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'B', bits: 8 }
        ],
        uses: 'Android, Java, iOS',
        color_depth: '16.7M + Alpha'
      },
      xrgb8888: {
        name: 'XRGB 32-bit',
        channels: [
          { name: 'X', bits: 8 },
          { name: 'R', bits: 8 },
          { name: 'G', bits: 8 },
          { name: 'B', bits: 8 }
        ],
        uses: 'Linux Framebuffer',
        color_depth: '16.7M'
      },
      argb4444: {
        name: 'ARGB 16-bit (4444)',
        channels: [
          { name: 'A', bits: 4, special: true },
          { name: 'R', bits: 4 },
          { name: 'G', bits: 4 },
          { name: 'B', bits: 4 }
        ],
        uses: '移动游戏, OpenGL',
        color_depth: '4K + Alpha'
      },
      rgba4444: {
        name: 'RGBA 16-bit (4444)',
        channels: [
          { name: 'R', bits: 4 },
          { name: 'G', bits: 4 },
          { name: 'B', bits: 4 },
          { name: 'A', bits: 4, special: true }
        ],
        uses: 'WebGL, 游戏',
        color_depth: '4K + Alpha'
      },
      rgb444: {
        name: 'RGB 12-bit (444)',
        channels: [
          { name: 'R', bits: 4 },
          { name: 'G', bits: 4 },
          { name: 'B', bits: 4 }
        ],
        uses: '某些显示设备',
        color_depth: '4K'
      },
      grayscale8: {
        name: '灰度 8-bit',
        channels: [
          { name: 'Gray', bits: 8 }
        ],
        uses: '医学影像, 扫描',
        color_depth: '256 级'
      },
      grayscale16: {
        name: '灰度 16-bit',
        channels: [
          { name: 'Gray', bits: 16 }
        ],
        uses: '医学影像, 高精度',
        color_depth: '65536 级'
      },
      rgb8: {
        name: 'RGB 8-bit (索引)',
        channels: [
          { name: 'Index', bits: 8 }
        ],
        uses: 'GIF, 旧网页, 调色板',
        color_depth: '256 色'
      },
      rgb4: {
        name: 'RGB 4-bit (索引)',
        channels: [
          { name: 'Index', bits: 4 }
        ],
        uses: '旧 DOS, 早期网页',
        color_depth: '16 色'
      },
      rgb2: {
        name: 'RGB 2-bit',
        channels: [
          { name: 'Index', bits: 2 }
        ],
        uses: '极限压缩',
        color_depth: '4 色'
      },
      rgb1: {
        name: '1-bit (黑白)',
        channels: [
          { name: 'Bit', bits: 1 }
        ],
        uses: '黑白扫描, 传真',
        color_depth: '2 色'
      },
      ycbcr: {
        name: 'YCbCr 24-bit',
        channels: [
          { name: 'Y', bits: 8 },
          { name: 'Cb', bits: 8 },
          { name: 'Cr', bits: 8 }
        ],
        uses: 'JPEG, 视频编码',
        color_depth: '16.7M'
      },
      hsv: {
        name: 'HSV 24-bit',
        channels: [
          { name: 'H', bits: 8 },
          { name: 'S', bits: 8 },
          { name: 'V', bits: 8 }
        ],
        uses: '图像处理, 色相编辑',
        color_depth: '16.7M'
      }
    };

    let currentColor = { r: 255, g: 87, b: 51 };

    function hexToRgb(hex) {
      const result = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    function rgbToHex(r, g, b) {
      return ((r << 16) | (g << 8) | b).toString(16).toUpperCase().padStart(6, '0');
    }

    function getChannelValue(channel, color) {
      if (channel === 'A') return 255;
      if (channel === 'Gray') {
        return Math.round(0.299 * color.r + 0.587 * color.g + 0.114 * color.b);
      }
      if (channel === 'Index') return 0;
      return color[channel.toLowerCase()];
    }

    function toBinary(value, bits) {
      const maxValue = (1 << bits) - 1;
      const normalized = Math.round((value / 255) * maxValue);
      return normalized.toString(2).padStart(bits, '0');
    }

    function renderFormat(formatKey, format, color) {
      let html = `<div class="format-card">
                <div class="format-title">${format.name}</div>
                <div class="bytes-row">`;

      let totalBits = 0;
      for (const channel of format.channels) {
        const bits = toBinary(getChannelValue(channel.name, color), channel.bits);
        totalBits += channel.bits;

        html += `<div class="byte-box">
                    <div class="byte-bits">`;

        for (let i = 0; i < bits.length; i++) {
          const isOn = bits[i] === '1';
          html += `<div class="bit ${isOn ? 'on' : ''}">${bits[i]}</div>`;
        }

        html += `</div>
                    <div class="byte-label">${channel.name}</div>
                </div>`;
      }

      html += `</div>`;

      const bytes = (totalBits / 8).toFixed(2);
      const details = `<div style="font-size: 12px; color: #999; min-width: 180px; text-align: right;">
                <div>${totalBits}bit / ${bytes}B</div>
                <div style="margin-top: 2px; color: #666;">${format.uses}</div>
            </div>`;

      html += details + `</div>`;

      return html;
    }

    function update() {
      const hex = rgbToHex(currentColor.r, currentColor.g, currentColor.b);
      document.getElementById('hexInput').value = hex;
      document.getElementById('colorPicker').value = `#${hex}`;

      // Render all formats
      let formatsHtml = '';
      for (const [key, format] of Object.entries(formats)) {
        formatsHtml += renderFormat(key, format, currentColor);
      }
      document.getElementById('formatsContainer').innerHTML = formatsHtml;

      // Render summary table
      let summaryHtml = '';
      for (const [key, format] of Object.entries(formats)) {
        const bytes = (format.channels.reduce((sum, c) => sum + c.bits, 0) / 8).toFixed(2);
        summaryHtml += `<tr>
                    <td><strong>${format.name}</strong></td>
                    <td>${format.channels.map(c => `${c.name}(${c.bits})`).join(' + ')}</td>
                    <td>${format.color_depth}</td>
                    <td><span class="byte-size">${bytes} B</span></td>
                    <td>${format.uses}</td>
                </tr>`;
      }
      document.getElementById('summaryTable').innerHTML = summaryHtml;
    }

    function hslToRgb(h, s, l) {
      s /= 100;
      l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return {
        r: Math.round(255 * f(0)),
        g: Math.round(255 * f(8)),
        b: Math.round(255 * f(4))
      };
    }

    document.getElementById('colorPicker').addEventListener('change', (e) => {
      const rgb = hexToRgb(e.target.value.slice(1));
      if (rgb) {
        currentColor = rgb;
        // update hue from new color and redraw palette
        const hsv = rgbToHsv(currentColor.r, currentColor.g, currentColor.b);
        hue = Math.round(hsv.h);
        document.getElementById('hueSlider').value = hue;
        drawPalette();
        update();
      }
    });

    // --- HSV palette / interaction support ---
    let hue = 14;

    function hsvToRgb(h, s, v) {
      s = Math.max(0, Math.min(1, s));
      v = Math.max(0, Math.min(1, v));
      const c = v * s;
      const hp = h / 60;
      const x = c * (1 - Math.abs((hp % 2) - 1));
      let r1 = 0, g1 = 0, b1 = 0;
      if (0 <= hp && hp < 1) { r1 = c; g1 = x; b1 = 0; }
      else if (1 <= hp && hp < 2) { r1 = x; g1 = c; b1 = 0; }
      else if (2 <= hp && hp < 3) { r1 = 0; g1 = c; b1 = x; }
      else if (3 <= hp && hp < 4) { r1 = 0; g1 = x; b1 = c; }
      else if (4 <= hp && hp < 5) { r1 = x; g1 = 0; b1 = c; }
      else { r1 = c; g1 = 0; b1 = x; }
      const m = v - c;
      return { r: Math.round((r1 + m) * 255), g: Math.round((g1 + m) * 255), b: Math.round((b1 + m) * 255) };
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      if (d === 0) h = 0;
      else if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * (((b - r) / d) + 2);
      else h = 60 * (((r - g) / d) + 4);
      if (h < 0) h += 360;
      const s = max === 0 ? 0 : d / max;
      const v = max;
      return { h, s, v };
    }

    function drawPalette() {
      const paletteEl = document.getElementById('palette');
      const base = hsvToRgb(hue, 1, 1);
      const baseColor = `rgb(${base.r}, ${base.g}, ${base.b})`;
      const whiteOverlay = 'linear-gradient(to right, #fff, rgba(255,255,255,0))';
      const blackOverlay = 'linear-gradient(to bottom, rgba(0,0,0,0), #000)';
      paletteEl.style.background = `${whiteOverlay}, ${blackOverlay}, ${baseColor}`;
      drawIndicator();
    }

    function drawIndicator() {
      const paletteEl = document.getElementById('palette');
      const indicator = document.getElementById('paletteIndicator');
      const rect = paletteEl.getBoundingClientRect();
      const hsv = rgbToHsv(currentColor.r, currentColor.g, currentColor.b);
      const x = Math.round(hsv.s * rect.width);
      const y = Math.round((1 - hsv.v) * rect.height);
      indicator.style.left = `${x}px`;
      indicator.style.top = `${y}px`;
    }

    const palette = document.getElementById('palette');
    let isPointerDown = false;

    function handlePointer(e) {
      const rect = palette.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      const s = x / rect.width;
      const v = 1 - (y / rect.height);
      const rgb = hsvToRgb(hue, s, v);
      currentColor = rgb;
      update();
      drawIndicator();
    }

    palette.addEventListener('pointerdown', (e) => { if (palette.setPointerCapture) palette.setPointerCapture(e.pointerId); isPointerDown = true; handlePointer(e); });
    palette.addEventListener('pointermove', (e) => { if (isPointerDown) handlePointer(e); });
    palette.addEventListener('pointerup', (e) => { isPointerDown = false; if (palette.releasePointerCapture) palette.releasePointerCapture(e.pointerId); });
    palette.addEventListener('pointercancel', () => { isPointerDown = false; });

    document.getElementById('hueSlider').addEventListener('input', (e) => { hue = parseInt(e.target.value, 10); drawPalette(); });

    // initial draw
    const initialHsv = rgbToHsv(currentColor.r, currentColor.g, currentColor.b);
    hue = Math.round(initialHsv.h);
    document.getElementById('hueSlider').value = hue;
    drawPalette();

    update();
  </script>
</body>

</html>
